name: fork-auto-rebuild

# Rebuilds this fork's local patch stack (fix/local-patch-stack) on every
# upstream release, so the installed binary always carries the newest upstream
# version *and* every open local patch, until each patch lands upstream (via the
# fork's own PRs or an equivalent fix). The stack currently holds three patches in
# four commits: the todo item-shape fix (upstream #16279); the opt-in
# composer.terminalForeground setting that keeps typed text on the terminal's own
# foreground in shared multiplexer panes, with its changelog entry; and a
# test-only fix: the background-tab
# screenshot test asserted `visibilityState === "hidden"` on a tab omp drives
# while upstream's sibling test for the same adoption already asserts "visible"
# (338a5b19e2, v18.18.6) — the adopted tab runs focus emulation
# (`Emulation.setFocusEmulationEnabled`: a focused AND active page), so the
# hidden expectation was stale and only surfaces where the browser suites
# actually execute. Artifacts are published as fork
# releases (`fork-<version>`) and consumed by the laptop-side `omp-fork-sync`
# script, which force-owns ~/.bun/bin/omp while the fork is live.
#
# Design notes (do not "simplify" these away):
#   - Everything builds on Linux: upstream cross-compiles every release binary
#     (incl. omp-darwin-arm64) here via Bazel `//:natives-darwin-arm64` +
#     `bun build --compile --target=bun-darwin-arm64`, then ad-hoc signs the
#     Mach-O with scripts/ci-macos-sign.sh (no Apple secrets needed).
#   - The branch push is `--force-with-lease` against the SHA recorded at job
#     start, so a human rebase/push that raced this run is never clobbered; a
#     conflicting rebase stops the run before anything is pushed or published.
#   - Retirement is per patch and only reported when EVERY patch is redundant,
#     because the todo fix passes a behavioural battery on the stock tree while
#     the composer setting is detected by its registration upstream. The
#     test-only fix has no probe: an upstream rewrite of that assertion either
#     makes the commit empty (dropped by --empty=drop) or conflicts, and a
#     conflict stops the run before anything is pushed or published. The
#     composer changelog commit needs the same hand: it adds a `### Added`
#     heading plus its bullet, while the merged PR puts the bullet in upstream's
#     own section, so --empty=drop cannot see it as present and the next rebase
#     conflicts or duplicates the heading. Drop that commit by hand when #18493
#     lands.
#   - Reproduce a red battery on the laptop instead of here: `bun install
#     --frozen-lockfile`, then stage the darwin addon from the exact npm leaf
#     (`@oh-my-pi/pi-natives-darwin-arm64@<version>`, copy the .node into
#     packages/natives/native/ and run scripts/stamp-native-version.ts) because
#     there is no local Rust toolchain, then run the exact `$ bun test ...` chunk
#     copied from the failed log. Without that addon every suite dies at import.
#   - Trigger matrix: the `schedule` poll of the latest upstream release every 2h
#     is the normal path, so a rebuild no longer depends on any machine being
#     awake; `workflow_dispatch` from the laptop's `omp-fork-sync` script or from
#     a human is the fallback (missed poll, upstream release while the repo is
#     quiet) and the only way to force a rebuild of an already-current tag.
on:
   schedule:
      # Upstream publishes roughly daily. Polling it here keeps rebuilds independent
      # of the laptop (omp-fork-sync dispatches only as a fallback). The
      # "Skip when already current" path below makes a poll that finds nothing new a
      # ~2 minute no-op, and the `fork-auto-rebuild` concurrency group serialises it
      # against a build already in progress.
      - cron: "7 */2 * * *"
   workflow_dispatch:
      inputs:
         target_tag:
            description: "Upstream release tag to rebuild on (empty = latest release)"
            required: false
            default: ""
         force:
            description: "Rebuild even when the fork branch already sits on that tag (true/false)"
            type: string
            default: "false"

permissions:
   contents: write
   issues: write

concurrency:
   group: fork-auto-rebuild
   cancel-in-progress: false

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
   UPSTREAM_REPO: can1357/oh-my-pi
   FIX_BRANCH: fix/local-patch-stack
   RELEASE_TAG_PREFIX: fork-
   # Upstream's per-test wall-clock ceiling (see ci.yml).
   OMP_TEST_TIMEOUT: "120"

jobs:
   rebuild:
      name: Rebase, test, build omp-darwin-arm64
      runs-on: ubuntu-22.04
      timeout-minutes: 360
      steps:
         - name: Checkout fork
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Record pre-run state and fetch upstream
           id: pre
           shell: bash
           run: |
              set -euo pipefail
              git config user.name "fork-rebuild [bot]"
              git config user.email "fork-rebuild@users.noreply.github.com"
              git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
              git fetch --tags --force upstream
              echo "before=$(git rev-parse "origin/${FIX_BRANCH}")" >> "$GITHUB_OUTPUT"

         - name: Resolve target release
           id: target
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              tag="${{ inputs.target_tag }}"
              if [ -z "$tag" ]; then
                 tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
              fi
              if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tag"; then
                 echo "::error::unexpected upstream tag '$tag'"
                 exit 1
              fi
              if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" > /dev/null; then
                 echo "::error::tag '$tag' is not present in this checkout"
                 exit 1
              fi
              target_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
              # The release name and the version the binary reports must agree:
              # a tag that does not contain the matching version bump (upstream
              # has re-pointed tags before) would otherwise publish fork-X while
              # the artifact prints omp/Y, and the sync would refuse to install it.
              tree_version="$(git show "${tag}:packages/coding-agent/package.json" | jq -r '.version // empty' 2>/dev/null || true)"
              if [ -z "$tree_version" ]; then
                 tree_version="${tag#v}"
              elif [ "$tree_version" != "${tag#v}" ]; then
                 echo "::warning title=Version mismatch::tag ${tag} carries package version ${tree_version}; naming the release after the tree"
              fi
              base_sha="$(git merge-base "origin/${FIX_BRANCH}" "refs/tags/${tag}^{commit}")"
              release_tag="${RELEASE_TAG_PREFIX}${tree_version}"
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                 release_exists=true
              else
                 release_exists=false
              fi
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "version=${tree_version}" >> "$GITHUB_OUTPUT"
              echo "sha=${target_sha}" >> "$GITHUB_OUTPUT"
              # "Current" means nothing left to do: the artifact for this exact
              # upstream tag exists. The stack base is diagnostic only — when a
              # push is rejected the branch stays parked on an older tag's base
              # forever, and gating on it would rebuild the same artifact on every
              # timer cycle.
              echo "stack base ${base_sha} vs target ${tag} (${target_sha}); release $release_tag exists=${release_exists}"
              if [ "$release_exists" = true ]; then
                 echo "current=true" >> "$GITHUB_OUTPUT"
              else
                 echo "current=false" >> "$GITHUB_OUTPUT"
              fi

         - name: Skip when already current
           if: steps.target.outputs.current == 'true' && inputs.force != 'true'
           shell: bash
           run: |
              echo "Nothing to do: ${FIX_BRANCH} is already based on ${{ steps.target.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
              echo "Pass force=true to rebuild this tag anyway." >> "$GITHUB_STEP_SUMMARY"

         # ---- everything below only runs when there is real work ------------

         - name: Rebase fix stack onto target release
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              git checkout -B "$FIX_BRANCH" "origin/${FIX_BRANCH}"
              # The stack's fork point, never its tip's parent: with more than
              # one patch, ~1 is the second patch and --onto would drop every
              # commit below it.
              base="$(git merge-base "$FIX_BRANCH" "${{ steps.target.outputs.sha }}")"
              if [ "$base" = "${{ steps.target.outputs.sha }}" ]; then
                 echo "Already rebased onto ${{ steps.target.outputs.tag }}; rebuild only."
                 exit 0
              fi
              before_count="$(git rev-list --count "${FIX_BRANCH}" "^${base}")"
              # --empty=drop: a commit whose diff upstream already contains is
              # dropped, which is the exact signal the retirement probe reports.
              git rebase --empty=drop --onto "${{ steps.target.outputs.sha }}" "$base"
              after_count="$(git rev-list --count HEAD "^${{ steps.target.outputs.sha }}")"
              echo "stack commits before=${before_count} after=${after_count}"
              if [ "${after_count}" -lt "${before_count}" ]; then
                 echo "::notice title=Patch dropped::a stack commit was dropped as already present upstream"
              fi
              echo "rebased head: $(git rev-parse HEAD)"
              git log --oneline "${{ steps.target.outputs.tag }}..HEAD" | tee "$GITHUB_STEP_SUMMARY"

         - name: Install bun and dependencies
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: ./.github/actions/bun-install

         - name: Compose bazel rc
           id: bazelrc
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: ./.github/actions/bazel-cache

         - name: Restore bazel and cargo caches
           id: bazelcache
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: actions/cache/restore@v4
           with:
              path: |
                 ~/.cache/bazel-disk
                 ~/.cache/bazel-repo
                 ~/.cargo/registry
                 ~/.cargo/git
              key: fork-bazel-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock', 'rust-toolchain.toml', '.bazelversion', 'bazel/**', 'crates/**') }}
              restore-keys: |
                 fork-bazel-${{ runner.os }}-

         - name: Install bazelisk
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              if command -v bazelisk > /dev/null; then
                 bazelisk version | head -3
                 exit 0
              fi
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/bazelisk" \
                 https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
              chmod +x "$RUNNER_TEMP/bazelisk"
              echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

         # The darwin cross toolchain materializes Apple's Command Line Tools SDK
         # from swcdn.apple.com, which answers 403 to some cloud runner IPs (proven
         # 2026-11-01: curl and bazel alike, six attempts). Bazel makes one attempt
         # and aborts the analysis, so the SDK archive is seeded into bazel's
         # repository cache here (sha256-pinned, retries safe) and the cache carries
         # it afterwards. The npm-leaf path below skips this entirely.
         - name: Seed the macOS SDK package in the bazel repository cache
           if: always() && steps.target.outputs.current != 'true'
           shell: bash
           continue-on-error: true
           run: |
              set -uo pipefail
              url="https://swcdn.apple.com/content/downloads/58/48/082-83364-A_KCEBOO2NJS/0d2rj4y5ucjlkgcvqt6f6a4pergug5tu2b/CLTools_macOSNMOS_SDK.pkg"
              sha="d55351824fd17742fd6e1e7a252fa1028698f32147ee48be9a6b75442bf30575"
              dest="$HOME/.cache/bazel-repo/content_addressable/sha256/$sha/file"
              if [ -f "$dest" ] && [ "$(sha256sum "$dest" | cut -d' ' -f1)" = "$sha" ]; then
                 echo "macOS SDK package already in the bazel repository cache"
                 exit 0
              fi
              mkdir -p "$(dirname "$dest")"
              tmp="$dest.part.$$"
              for attempt in 1 2 3 4 5 6; do
                 if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
                       --connect-timeout 20 --max-time 900 -A "Mozilla/5.0" -o "$tmp" "$url"; then
                    if [ "$(sha256sum "$tmp" | cut -d' ' -f1)" = "$sha" ]; then
                       mv -f "$tmp" "$dest"
                       echo "cached the macOS SDK package"
                       exit 0
                    fi
                    echo "attempt ${attempt}: checksum mismatch"
                 else
                    echo "attempt ${attempt}: download failed"
                 fi
                 sleep $((attempt * 5))
              done
              rm -f "$tmp"
              echo "::warning::macOS SDK package not cached; bazel will try the CDN itself"

         - name: Build linux-x64 native addons (test harness)
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation: several at once OOMs the link steps
              # (upstream hits this on their pods too, see ci.yml).
              for target in natives-linux-x64-baseline natives-linux-x64-modern; do
                 bazelisk --bazelrc="${{ steps.bazelrc.outputs.rc }}" \
                    build --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk" \
                    "//:${target}"
              done
              mkdir -p packages/natives/native
              for target in natives-linux-x64-baseline natives-linux-x64-modern; do
                 cp -L bazel-bin/"${target}"/*.node packages/natives/native/
              done
              ls -l packages/natives/native/
              # Bazel emits the addon post-link, before the release stamp exists;
              # the standalone-binary embedder rejects an unstamped addon.
              for addon in packages/natives/native/*.node; do
                 bun scripts/stamp-native-version.ts "$addon"
              done

         # The stack carries two independent patches (todo item shapes, and the
         # composer.terminalForeground setting). Each probe asks whether the
         # STOCK tag already covers that patch; the fork is retired only when
         # every patch is redundant.
         - name: Retirement probes (stock tag vs each fork patch)
           id: retire
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           continue-on-error: true
           run: |
              set -uo pipefail
              tag="${{ steps.target.outputs.tag }}"
              todo_retired=false
              composer_retired=false

              # Composer patch: upstream registering the same setting id is the
              # equivalence signal; no behavioural test is needed for it.
              if git grep -qF 'composer.terminalForeground' "$tag" -- packages/coding-agent/src/modes/settings.ts; then
                 composer_retired=true
              fi

              # Todo patch: the fork's regression suite must pass on the stock
              # tree. Untracked build outputs survive the detached checkout.
              git checkout --detach "${{ steps.target.outputs.sha }}"
              git checkout "${FIX_BRANCH}" -- packages/coding-agent/test/tools/todo.test.ts
              set +e
              ( cd packages/coding-agent && bun test test/tools/todo.test.ts ) 2>&1 | tail -60
              rc="${PIPESTATUS[0]}"
              set -e
              git checkout -f "${FIX_BRANCH}"
              if [ "$rc" -eq 0 ]; then todo_retired=true; fi

              echo "todo patch redundant on stock $tag: ${todo_retired}" >> "$GITHUB_STEP_SUMMARY"
              echo "composer patch redundant on stock $tag: ${composer_retired}" >> "$GITHUB_STEP_SUMMARY"
              if [ "$todo_retired" = true ] && [ "$composer_retired" = true ]; then
                 echo "retired=true" >> "$GITHUB_OUTPUT"
              else
                 echo "retired=false" >> "$GITHUB_OUTPUT"
              fi

         # Prefer the version-pinned npm leaf for the darwin addon: the local
         # patches touch no Rust, so the addon published for this exact upstream
         # version is the same bytes the SDK cross build produces, and it removes
         # Apple's CDN from the critical path. Bazel stays as the fallback.
         - name: Stage darwin-arm64 native addon
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              TARGET_VERSION: ${{ steps.target.outputs.version }}
           run: |
              set -eo pipefail
              mkdir -p packages/natives/native
              addon="packages/natives/native/pi_natives.darwin-arm64.node"
              leaf="@oh-my-pi/pi-natives-darwin-arm64@${TARGET_VERSION}"
              tarball="$(npm view "$leaf" dist.tarball 2>/dev/null || true)"
              if [ -n "$tarball" ]; then
                 curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/leaf.tgz" "$tarball"
                 tar -xzf "$RUNNER_TEMP/leaf.tgz" -C "$RUNNER_TEMP"
                 cp "$RUNNER_TEMP/package/pi_natives.darwin-arm64.node" "$addon"
                 echo "darwin addon staged from $leaf"
              else
                 echo "::warning title=npm leaf missing::no $leaf published; building the darwin addon with bazel"
                 if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
                 built=false
                 for attempt in 1 2 3; do
                    if bazelisk --bazelrc="${{ steps.bazelrc.outputs.rc }}" \
                          build --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk" \
                          //:natives-darwin-arm64; then
                       built=true
                       break
                    fi
                    echo "bazel darwin build attempt ${attempt} failed"
                    sleep 20
                 done
                 [ "$built" = true ] || { echo "::error::darwin addon build failed after retries"; exit 1; }
                 cp -L bazel-bin/natives-darwin-arm64/*.node "$addon"
              fi
              if ! bun scripts/stamp-native-version.ts "$addon"; then
                 echo "::warning::addon left as published; the embedder accepts a pre-stamp addon"
              fi
              file "$addon"

         # Cold bazel work here is ~20 min per addon, so the caches are persisted
         # even when a later step fails; otherwise every debugging iteration
         # pays the cold price again.
         - name: Save bazel and cargo caches
           if: always() && steps.bazelcache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@v4
           with:
              path: |
                 ~/.cache/bazel-disk
                 ~/.cache/bazel-repo
                 ~/.cargo/registry
                 ~/.cargo/git
              key: fork-bazel-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock', 'rust-toolchain.toml', '.bazelversion', 'bazel/**', 'crates/**') }}

         - name: Build release binary
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              RELEASE_TARGETS: darwin-arm64
           run: |
              set -euo pipefail
              bun run ci:release:build-binaries
              binary="packages/coding-agent/binaries/omp-darwin-arm64"
              file "$binary"
              # The artifact must contain the fork patch, not just the tag. These
              # strings are added by the fix commit (prompt text + ambiguity
              # error) and are absent from a stock build. When the rebase dropped
              # the commit as redundant, the stack is empty and upstream's own
              # wording applies, so the assertions are skipped rather than
              # blocking the publish.
              stack_subjects="$(git log --format=%s "${{ steps.target.outputs.tag }}..HEAD")"
              echo "marker counts: ambiguity=$(grep -ac 'matches multiple items' "$binary" || true) keyrule=$(grep -ac 'must be the task text as a plain string' "$binary" || true) composer=$(grep -ac 'composer.terminalForeground' "$binary" || true)"
              if grep -q 'wrapped todo item shapes' <<< "$stack_subjects"; then
                 # Prompt markdown is not stored verbatim in the bundle, so the
                 # markers are the patch's own TS string literals.
                 grep -aqF 'matches multiple items' "$binary" \
                    || { echo "::error::todo patch ambiguity guard missing from the built binary"; exit 1; }
                 grep -aqF 'must be the task text as a plain string' "$binary" \
                    || { echo "::error::todo patch item-key validation missing from the built binary"; exit 1; }
                 echo "todo patch markers present in the artifact"
              else
                 echo "todo patch is not in the stack; its markers skipped"
              fi
              if grep -q 'terminalForeground' <<< "$stack_subjects"; then
                 grep -aqF 'composer.terminalForeground' "$binary" \
                    || { echo "::error::composer patch setting missing from the built binary"; exit 1; }
                 echo "composer patch marker present in the artifact"
              else
                 echo "composer patch is not in the stack; its marker skipped"
              fi
              bash scripts/ci-macos-sign.sh "$binary"
              cd packages/coding-agent/binaries
              sha256sum omp-darwin-arm64 > SHA256SUMS.txt
              cat SHA256SUMS.txt

         # The battery runs after the artifact is built and asserted, so an
         # artifact problem surfaces in minutes instead of after 30 minutes of
         # tests; nothing is pushed or published until both are green.
         - name: Test battery and lint
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              bun run check:tools
              # The battery launches a real Chromium for its browser suites, and
              # those suites run only where `chromiumAvailable()`'s 5 s CDP probe
              # passes — chromium-probe.ts documents hosted runners that hold the
              # downloaded binary but cannot exec it, and this job's probe does
              # pass. One retry absorbs a transient browser or CPU hiccup on a
              # 2-core runner without hiding a regression: anything real fails
              # both attempts (same form as the bun-install retry in
              # .github/actions/bun-install).
              attempt=1
              while :; do
                 if bun scripts/ci-test-ts.ts local-ts; then
                    break
                 fi
                 if [ "$attempt" -ge 2 ]; then
                    echo "::error title=Test battery failed twice::the battery is red on attempt ${attempt}; treating it as a regression"
                    exit 1
                 fi
                 attempt=$((attempt + 1))
                 echo "::warning title=Test battery retry::the battery failed; retrying once (attempt ${attempt}/2)"
              done

         # The branch push is provenance, not the deliverable, but it is also the
         # only way this fork ever receives upstream commits, so it has to land.
         # GitHub refuses any push whose range touches .github/workflows/** unless
         # the pushing credential carries the `workflow` scope. The GITHUB_TOKEN (a
         # GitHub App installation token) is refused, and a write deploy key is
         # refused too — a deploy-key retry is NOT exempt (verified 2026-11-09,
         # when upstream v18.18.2 edited ci.yml: the branch push and the provenance
         # tag push were both rejected). An account SSH key is not subject to that
         # restriction, so FORK_PUSH_KEY (an account key, not a deploy key) is the
         # primary credential; the App token and the deploy key stay as fallbacks
         # for the case where upstream did not touch a workflow file.
         - name: Push rebased branch
           id: push
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              FORK_PUSH_KEY: ${{ secrets.FORK_PUSH_KEY }}
              FORK_DEPLOY_KEY: ${{ secrets.FORK_DEPLOY_KEY }}
           run: |
              set -uo pipefail
              lease="refs/heads/${FIX_BRANCH}:${{ steps.pre.outputs.before }}"
              refspec="refs/heads/${FIX_BRANCH}:refs/heads/${FIX_BRANCH}"
              ssh_url="git@github.com:${GITHUB_REPOSITORY}.git"
              ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null || true
              # A secret key gets a pinned host key, no agent and no other
              # identities: the runner trusts nothing it did not see itself.
              ssh_push() {
                 local key="$1"
                 shift
                 GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes" \
                    git push "$@"
              }
              write_key() {
                 printf '%s\n' "$1" > "$2"
                 chmod 600 "$2"
              }
              pushed=false
              tagged=false
              if [ -n "${FORK_PUSH_KEY:-}" ]; then
                 write_key "$FORK_PUSH_KEY" "$RUNNER_TEMP/push_key"
                 if ssh_push "$RUNNER_TEMP/push_key" --force-with-lease="$lease" "$ssh_url" "$refspec"; then
                    pushed=true
                    echo "pushed with the account key"
                 else
                    echo "::warning title=Account key refused the push::falling back to the workflow token"
                 fi
              else
                 echo "::warning::no FORK_PUSH_KEY secret; the workflow token cannot carry workflow-file changes"
              fi
              if [ "$pushed" != true ]; then
                 if git push --force-with-lease="$lease" origin "$refspec"; then
                    pushed=true
                    echo "pushed with the workflow token"
                 elif [ -n "${FORK_DEPLOY_KEY:-}" ]; then
                    echo "::warning title=Workflow token refused the push::retrying over the deploy key"
                    write_key "$FORK_DEPLOY_KEY" "$RUNNER_TEMP/deploy_key"
                    if ssh_push "$RUNNER_TEMP/deploy_key" --force-with-lease="$lease" "$ssh_url" "$refspec"; then
                       pushed=true
                       echo "pushed with the deploy key"
                    fi
                 fi
              fi
              # Last resort: a provenance tag. It is NOT exempt from the workflow
              # rule either (a tag introducing the same commits is refused the same
              # way), but it still covers a repository that only protects branches.
              if [ "$pushed" != true ]; then
                 stack_tag="stack-${{ steps.target.outputs.version }}"
                 if git push --force origin "HEAD:refs/tags/${stack_tag}"; then
                    tagged=true
                    echo "pushed the stack tag ${stack_tag} at $(git rev-parse HEAD)"
                 fi
              fi
              echo "pushed=${pushed}" >> "$GITHUB_OUTPUT"
              echo "tagged=${tagged}" >> "$GITHUB_OUTPUT"

         - name: Publish fork release
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TARGET_TAG: ${{ steps.target.outputs.tag }}
              TARGET_VERSION: ${{ steps.target.outputs.version }}
              RETIRED: ${{ steps.retire.outputs.retired }}
           run: |
              set -euo pipefail
              release_tag="${RELEASE_TAG_PREFIX}${TARGET_VERSION}"
              head_sha="$(git rev-parse HEAD)"
              # Title honesty: the stack grows and shrinks (commits are added when a
              # new local fix appears, dropped when upstream lands one), so count it
              # here instead of hardcoding a number that goes stale the next time a
              # patch is added.
              stack_commits="$(git rev-list --count "${TARGET_TAG}..HEAD")"
              notes="$RUNNER_TEMP/notes.md"
              branch_state="${{ steps.push.outputs.pushed }}"
              tag_state="${{ steps.push.outputs.tagged }}"
              if [ "$branch_state" = "true" ] || [ "$tag_state" = "true" ]; then
                 target="$head_sha"
                 intended_sha="$head_sha"
                 stack_state="stack committed at ${head_sha} (branch=${branch_state} tag=${tag_state})"
              else
                 intended_sha=""
                 stack_state=""
              fi
              # A release cannot be targeted at a commit this repository does not
              # carry: the API answers 403 "Resource not accessible by integration"
              # when target_commitish is a commit that only exists upstream (hit
              # 2026-11-09, when the v18.18.2 rebase could not be pushed and the
              # release fell back to the upstream sha). Anchor the tag on the most
              # specific commit the fork actually has, and say which one in the
              # notes.
              fork_has_commit() {
                 gh api "repos/${GITHUB_REPOSITORY}/git/commits/$1" --jq .sha > /dev/null 2>&1
              }
              if [ -z "$intended_sha" ] || ! fork_has_commit "$intended_sha"; then
                 if [ -z "$intended_sha" ]; then
                    anchor_why="the stack could not be pushed, so the artifact has no commit of its own here"
                 else
                    anchor_why="stack head ${head_sha} is not in this repository"
                 fi
                 intended_sha=""
                 for candidate in "${{ steps.pre.outputs.before }}" \
                                   "$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)" \
                                   "$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}" 2>/dev/null || true)"; do
                    [ -n "$candidate" ] || continue
                    if fork_has_commit "$candidate"; then
                       intended_sha="$candidate"
                       break
                    fi
                 done
                 if [ -z "$intended_sha" ]; then
                    echo "::error::no commit of ${GITHUB_REPOSITORY} is available to target ${release_tag}"
                    exit 1
                 fi
                 target="$intended_sha"
                 stack_state="built on upstream ${TARGET_TAG} with the stack patch attached (${anchor_why}); release anchored at ${intended_sha}"
              fi
              if [ "$RETIRED" = "true" ]; then
                 probe="stock upstream PASSES the regression battery - the patch is redundant and stock 'omp update' is safe"
              else
                 probe="stock upstream still fails the regression battery - the patch is still required"
              fi
              {
                 echo "Upstream release: https://github.com/${UPSTREAM_REPO}/releases/tag/${TARGET_TAG}"
                 echo
                 echo "Fork commit: ${head_sha} (${FIX_BRANCH})"
                 echo "Stack: ${stack_state}"
                 echo "Battery: local-ts + check:tools green on this tree."
                 echo "Retirement probe: ${probe}"
                 echo
                 echo '```'
                 git log --oneline "${TARGET_TAG}..HEAD"
                 echo '```'
              } > "$notes"
              artifacts="packages/coding-agent/binaries/omp-darwin-arm64 packages/coding-agent/binaries/SHA256SUMS.txt STACK.patch"
              git diff "${TARGET_TAG}" HEAD > STACK.patch
              # A release cannot be re-targeted later, so when the branch now
              # carries the artifact's commit but the existing release points
              # elsewhere, delete and recreate rather than upload onto a wrong tag.
              existing_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq .object.sha 2>/dev/null || true)"
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                 if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$intended_sha" ]; then
                    echo "::notice title=Re-tagging::existing release points at ${existing_tag_sha}, this artifact at ${head_sha}; recreating the tag"
                    gh release delete "$release_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
                 fi
              fi
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                 gh release upload "$release_tag" $artifacts --repo "$GITHUB_REPOSITORY" --clobber
                 gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              else
                 gh release create "$release_tag" $artifacts --repo "$GITHUB_REPOSITORY" \
                    --target "$target" \
                    --title "omp ${{ steps.target.outputs.version }} + ${stack_commits} local commits" \
                    --notes-file "$notes"
              fi
              echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}" >> "$GITHUB_STEP_SUMMARY"

         - name: Flag a redundant patch
           if: steps.retire.outputs.retired == 'true'
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TARGET_TAG: ${{ steps.target.outputs.tag }}
           run: |
              set -euo pipefail
              title="Retire fork: upstream ${TARGET_TAG} covers every local patch"
              body_file="$RUNNER_TEMP/retire-body.md"
              printf 'Every probe-able fork patch is now redundant on the stock upstream tree (%s): the todo-shape regression battery passes there and the composer.terminalForeground setting is registered upstream, so %s adds nothing. Check the test-only commit (the background-tab screenshot visibility assertion) before deleting the workflow: it has no probe.\n\nNext step: run `omp update` to return to stock binaries, delete the omp-fork-sync LaunchAgent and script from the dotfiles, and delete this workflow.\n' \
                 'todo.test.ts' "$FIX_BRANCH" > "$body_file"
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                 | jq -r '.[] | select(.title | startswith("Retire fork:")) | .number' | head -n1)"
              if [ -n "${existing:-}" ]; then
                 gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
              else
                 gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
              fi

         - name: Report failure
           if: failure()
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              tag="${{ steps.target.outputs.tag }}"
              [ -n "$tag" ] || tag="unknown"
              title="fork-auto-rebuild failing for ${tag}"
              body_file="$RUNNER_TEMP/failure-body.md"
              # Name the steps that failed: a tracker that only says "failed"
              # forces every reader to open the run to learn anything.
              steps_failed="$(gh run view "${GITHUB_RUN_ID}" --repo "$GITHUB_REPOSITORY" --json jobs \
                 --jq '[.jobs[].steps[] | select(.conclusion == "failure") | "\(.number). \(.name)"] | join(", ")' 2>/dev/null || true)"
              {
                 echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                 echo
                 if [ -n "${steps_failed:-}" ]; then
                    echo "Failing step(s): ${steps_failed}"
                    echo
                 fi
                 echo "The installed binary was NOT touched: a failed run changes the publication surface only, and the laptop sync installs nothing without a matching release asset."
              } > "$body_file"
              # One tracking issue, one tracking comment. Every later failure
              # EDITS that comment and retitles the issue to the current target;
              # appending a fresh copy per run is what turned this tracker into a
              # wall of identical lines (7 of them on 2026-11-06). Duplicates left
              # by earlier runs are deleted here, so the issue converges to one.
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                 | jq -r '.[] | select(.title | test("^fork-auto-rebuild fail(ed|ing) ")) | .number' | head -n1)"
              if [ -z "${existing:-}" ]; then
                 gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
                 exit 0
              fi
              comment_ids="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" --paginate \
                 --jq '.[] | select(.user.type == "Bot") | .id' 2>/dev/null || true)"
              first_comment="$(head -n1 <<< "${comment_ids:-}")"
              if [ -n "${first_comment:-}" ]; then
                 gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${first_comment}" -F "body=@${body_file}" > /dev/null
                 tail -n +2 <<< "${comment_ids}" | while read -r duplicate; do
                    if [ -n "${duplicate:-}" ]; then
                       gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${duplicate}" > /dev/null
                    fi
                 done
              else
                 gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
              fi
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title"

         # The counterpart to Report failure: a tracker that stays open after the
         # build recovers is the same noise as a duplicate comment, so crossing
         # the end of the job closes it. Only fires on a green run, never on the
         # failure path.
         - name: Close the failure tracker once the job survives
           if: success()
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TARGET_TAG: ${{ steps.target.outputs.tag }}
           run: |
              set -euo pipefail
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                 | jq -r '.[] | select(.title | test("^fork-auto-rebuild fail(ed|ing) ")) | .number' | head -n1)"
              [ -n "${existing:-}" ] || exit 0
              # The failure path named it "failing for <tag>"; a closed issue
              # still wearing that title reads as an active outage.
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
                 --title "fork-auto-rebuild recovered for ${TARGET_TAG:-unknown}"
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed \
                 --comment "Recovered: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} completed green for ${TARGET_TAG:-the current target}."
