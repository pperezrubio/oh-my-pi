name: fork-auto-rebuild

# Rebuilds this fork's todo-fix stack (fix/todo-item-normalization) on every
# upstream release, so the installed binary always carries the newest upstream
# version *and* the fork's open patch, until the patch lands upstream (via the
# fork's own PR or an equivalent fix). Artifacts are published as fork releases
# (`fork-<version>`) and consumed by the laptop-side `omp-fork-sync` script,
# which force-owns ~/.bun/bin/omp while the fork is live.
#
# Design notes (do not "simplify" these away):
#   - Everything builds on Linux: upstream cross-compiles every release binary
#     (incl. omp-darwin-arm64) here via Bazel `//:natives-darwin-arm64` +
#     `bun build --compile --target=bun-darwin-arm64`, then ad-hoc signs the
#     Mach-O with scripts/ci-macos-sign.sh (no Apple secrets needed).
#   - The branch push is `--force-with-lease` against the SHA recorded at job
#     start, so a human rebase/push that raced this run is never clobbered; a
#     conflicting rebase stops the run before anything is pushed or published.
#   - The retirement probe runs this fork's regression tests against the STOCK
#     upstream tag. Green there means upstream now handles every malformed todo
#     shape the patch supports, i.e. the fork's patch is redundant: an issue is
#     opened and the next `omp-fork-sync` reports that stock `omp update` is
#     safe again.
on:
   workflow_dispatch:
      inputs:
         target_tag:
            description: "Upstream release tag to rebuild on (empty = latest release)"
            required: false
            default: ""
         force:
            description: "Rebuild even when the fork branch already sits on that tag"
            type: boolean
            default: false

permissions:
   contents: write
   issues: write

concurrency:
   group: fork-auto-rebuild
   cancel-in-progress: false

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
   UPSTREAM_REPO: can1357/oh-my-pi
   FIX_BRANCH: fix/todo-item-normalization
   RELEASE_TAG_PREFIX: fork-
   # Upstream's per-test wall-clock ceiling (see ci.yml).
   OMP_TEST_TIMEOUT: "120"

jobs:
   rebuild:
      name: Rebase, test, build omp-darwin-arm64
      runs-on: ubuntu-22.04
      timeout-minutes: 240
      steps:
         - name: Checkout fork
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Record pre-run state and fetch upstream
           id: pre
           shell: bash
           run: |
              set -euo pipefail
              git config user.name "fork-rebuild [bot]"
              git config user.email "fork-rebuild@users.noreply.github.com"
              git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
              git fetch --tags --force upstream
              echo "before=$(git rev-parse "origin/${FIX_BRANCH}")" >> "$GITHUB_OUTPUT"

         - name: Resolve target release
           id: target
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              tag="${{ inputs.target_tag }}"
              if [ -z "$tag" ]; then
                 tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
              fi
              if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tag"; then
                 echo "::error::unexpected upstream tag '$tag'"
                 exit 1
              fi
              if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" > /dev/null; then
                 echo "::error::tag '$tag' is not present in this checkout"
                 exit 1
              fi
              target_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
              base_sha="$(git rev-parse "origin/${FIX_BRANCH}~1")"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              echo "sha=${target_sha}" >> "$GITHUB_OUTPUT"
              if [ "$target_sha" = "$base_sha" ]; then
                 echo "current=true" >> "$GITHUB_OUTPUT"
                 echo "fork branch already sits on ${tag}; force=${{ inputs.force }}"
              else
                 echo "current=false" >> "$GITHUB_OUTPUT"
                 echo "fork branch base ${base_sha} -> rebasing onto ${tag} (${target_sha})"
              fi

         - name: Skip when already current
           if: steps.target.outputs.current == 'true' && inputs.force != 'true'
           shell: bash
           run: |
              echo "Nothing to do: ${FIX_BRANCH} is already based on ${{ steps.target.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
              echo "Pass force=true to rebuild this tag anyway." >> "$GITHUB_STEP_SUMMARY"

         # ---- everything below only runs when there is real work ------------

         - name: Rebase fix stack onto target release
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              git checkout -B "$FIX_BRANCH" "origin/${FIX_BRANCH}"
              base="$(git rev-parse "${FIX_BRANCH}~1")"
              if [ "$base" = "${{ steps.target.outputs.sha }}" ]; then
                 echo "Already rebased onto ${{ steps.target.outputs.tag }}; rebuild only."
                 exit 0
              fi
              # --empty=drop: a commit whose diff upstream already contains is
              # dropped, which is the exact signal the retirement probe reports.
              git rebase --empty=drop --onto "${{ steps.target.outputs.sha }}" "$base"
              echo "rebased head: $(git rev-parse HEAD)"
              git log --oneline "${{ steps.target.outputs.tag }}..HEAD" | tee "$GITHUB_STEP_SUMMARY"

         - name: Install bun and dependencies
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: ./.github/actions/bun-install

         - name: Compose bazel rc
           id: bazelrc
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: ./.github/actions/bazel-cache

         - name: Restore bazel and cargo caches
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           uses: actions/cache@v4
           with:
              path: |
                 ~/.cache/bazel-disk
                 ~/.cache/bazel-repo
                 ~/.cargo/registry
                 ~/.cargo/git
              key: fork-bazel-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock', 'rust-toolchain.toml', '.bazelversion', 'bazel/**', 'crates/**') }}
              restore-keys: |
                 fork-bazel-${{ runner.os }}-

         - name: Install bazelisk
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              if command -v bazelisk > /dev/null; then
                 bazelisk version | head -3
                 exit 0
              fi
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/bazelisk" \
                 https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
              chmod +x "$RUNNER_TEMP/bazelisk"
              echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

         - name: Build linux-x64 native addons (test harness)
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation: several at once OOMs the link steps
              # (upstream hits this on their pods too, see ci.yml).
              for target in linux-x64-baseline linux-x64-modern; do
                 bazelisk --bazelrc="${{ steps.bazelrc.outputs.rc }}" \
                    build --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk" \
                    "//:${target}"
              done
              mkdir -p packages/natives/native
              for target in linux-x64-baseline linux-x64-modern; do
                 cp -L bazel-bin/"${target}"/*.node packages/natives/native/
              done
              ls -l packages/natives/native/

         - name: Retirement probe (stock tag vs fork regression battery)
           id: retire
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           continue-on-error: true
           run: |
              set -uo pipefail
              # Detached checkout of the stock tag; untracked build outputs
              # (packages/natives/native/*.node) survive it. The overlay only
              # touches one tracked file, discarded by the forced checkout back.
              git checkout --detach "${{ steps.target.outputs.sha }}"
              git checkout HEAD -- . > /dev/null 2>&1 || true
              git checkout "${FIX_BRANCH}" -- packages/coding-agent/test/tools/todo.test.ts
              set +e
              ( cd packages/coding-agent && bun test test/tools/todo.test.ts ) 2>&1 | tail -60
              rc="${PIPESTATUS[0]}"
              set -e
              git checkout -f "${FIX_BRANCH}"
              if [ "$rc" -eq 0 ]; then
                 echo "retired=true" >> "$GITHUB_OUTPUT"
                 echo "The fork's regression battery passes on the STOCK ${{ steps.target.outputs.tag }} tree: the patch is redundant." >> "$GITHUB_STEP_SUMMARY"
              else
                 echo "retired=false" >> "$GITHUB_OUTPUT"
                 echo "Stock ${{ steps.target.outputs.tag }} still fails the fork's regression battery: patch still required." >> "$GITHUB_STEP_SUMMARY"
              fi

         - name: Test battery and lint
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              bun run check:tools
              bun scripts/ci-test-ts.ts local-ts

         - name: Build darwin-arm64 native addon
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.bazelrc.outputs.rc }}" \
                 build --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk" \
                 //:darwin-arm64
              cp -L bazel-bin/darwin-arm64/*.node packages/natives/native/
              file packages/natives/native/pi_natives.darwin-arm64.node

         - name: Build release binary
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              RELEASE_TARGETS: darwin-arm64
           run: |
              set -euo pipefail
              bun run ci:release:build-binaries
              binary="packages/coding-agent/binaries/omp-darwin-arm64"
              file "$binary"
              # The artifact must contain the fork patch, not just the tag. These
              # strings are added by the fix commit (prompt text + ambiguity
              # error) and are absent from a stock build.
              grep -aqF 'items` entries are plain strings' "$binary" \
                 || { echo "::error::fork patch prompt line missing from the built binary"; exit 1; }
              grep -aqF 'matches multiple items' "$binary" \
                 || { echo "::error::fork patch ambiguity guard missing from the built binary"; exit 1; }
              bash scripts/ci-macos-sign.sh "$binary"
              cd packages/coding-agent/binaries
              sha256sum omp-darwin-arm64 > SHA256SUMS.txt
              cat SHA256SUMS.txt

         - name: Push rebased branch
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           run: |
              set -euo pipefail
              git push --force-with-lease="refs/heads/${FIX_BRANCH}:${{ steps.pre.outputs.before }}" \
                 origin "refs/heads/${FIX_BRANCH}:refs/heads/${FIX_BRANCH}"

         - name: Publish fork release
           if: steps.target.outputs.current != 'true' || inputs.force == 'true'
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TARGET_TAG: ${{ steps.target.outputs.tag }}
              TARGET_VERSION: ${{ steps.target.outputs.version }}
              RETIRED: ${{ steps.retire.outputs.retired }}
           run: |
              set -euo pipefail
              release_tag="${RELEASE_TAG_PREFIX}${TARGET_VERSION}"
              head_sha="$(git rev-parse HEAD)"
              notes="$RUNNER_TEMP/notes.md"
              if [ "$RETIRED" = "true" ]; then
                 probe="stock upstream PASSES the regression battery - the patch is redundant and stock 'omp update' is safe"
              else
                 probe="stock upstream still fails the regression battery - the patch is still required"
              fi
              {
                 echo "Upstream release: https://github.com/${UPSTREAM_REPO}/releases/tag/${TARGET_TAG}"
                 echo
                 echo "Fork commit: ${head_sha} (${FIX_BRANCH})"
                 echo "Battery: local-ts + check:tools green on this tree."
                 echo "Retirement probe: ${probe}"
                 echo
                 echo '```'
                 git log --oneline "${TARGET_TAG}..HEAD"
                 echo '```'
              } > "$notes"
              artifacts="packages/coding-agent/binaries/omp-darwin-arm64 packages/coding-agent/binaries/SHA256SUMS.txt"
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                 gh release upload "$release_tag" $artifacts --repo "$GITHUB_REPOSITORY" --clobber
                 gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              else
                 gh release create "$release_tag" $artifacts --repo "$GITHUB_REPOSITORY" \
                    --target "$head_sha" \
                    --title "omp ${{ steps.target.outputs.version }} + todo fix stack" \
                    --notes-file "$notes"
              fi
              echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}" >> "$GITHUB_STEP_SUMMARY"

         - name: Flag a redundant patch
           if: steps.retire.outputs.retired == 'true'
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TARGET_TAG: ${{ steps.target.outputs.tag }}
           run: |
              set -euo pipefail
              title="Retire fork: upstream ${TARGET_TAG} passes the #16279 regression battery"
              body_file="$RUNNER_TEMP/retire-body.md"
              printf 'The fork regression battery (%s) passes on the stock upstream tree, so %s no longer adds anything.\n\nNext step: run `omp update` to return to stock binaries, delete the omp-fork-sync LaunchAgent and script from the dotfiles, and delete this workflow.\n' \
                 'packages/coding-agent/test/tools/todo.test.ts' "$FIX_BRANCH" > "$body_file"
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                 | jq -r '.[] | select(.title | startswith("Retire fork:")) | .number' | head -n1)"
              if [ -n "${existing:-}" ]; then
                 gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
              else
                 gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
              fi

         - name: Report failure
           if: failure()
           shell: bash
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              tag="${{ steps.target.outputs.tag }}"
              [ -n "$tag" ] || tag="unknown"
              title="fork-auto-rebuild failed for ${tag}"
              body_file="$RUNNER_TEMP/failure-body.md"
              printf 'Run: %s/%s/actions/runs/%s\n\nThe installed binary was NOT touched: a failed run changes the publication surface only, and the laptop sync installs nothing without a matching release asset.\n' \
                 "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" > "$body_file"
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                 | jq -r '.[] | select(.title | startswith("fork-auto-rebuild failed")) | .number' | head -n1)"
              if [ -n "${existing:-}" ]; then
                 gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
              else
                 gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
              fi
